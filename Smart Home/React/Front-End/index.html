<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Importação do arquivo de estilos local -->
    <link rel="stylesheet" href="main.css">
    <!-- Importação da biblioteca FontAwesome para utilização dos ícones vetoriais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <!-- Importação do script do Bootstrap para possíveis componentes interativos (ex: modais, tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Container principal que envolve 100% da viewport (tela) -->
    <div class="tela_principal">

        <!-- Espaço reservado para um futuro cabeçalho (perfil, título, etc) -->
        <div class="parte_superior">
            
        </div>

        <!-- Painel flutuante branco superior onde ficam os botões de controle principal -->
        <div class="painel_criacao">

            <!-- Ícone de Mais (Add) Oficial do Font Awesome -->
            <div class="mais-grande-fino"></div>

            <div class="barra_vertical"></div>
            <!--Painel onde está a parte de criação e scan da rede-->
            <div class="painel_adicao">

                <!-- Título da seção de configuração -->
                <span class="letra_h1_negrito">Configuração e Adição</span>

                <!-- Grid que organiza os dois botões de ação (Criar Cômodo e Scan) lado a lado -->
                <div class="opcoes_painel">
                    <!-- Container e Botão para acionar a criação de um novo cômodo -->
                    <div class="botao_painel">
                    <button id="botao_criar" class="letra_h3" >CRIAR CÔMODO</button>
                    </div>

                    <!-- Container e Botão para iniciar o escaneamento na rede -->
                    <div class="botao_painel">
                        <button id="botao_scan" class="letra_h3">INICIAR SCAN DE REDE</button>
                    </div>
                </div>
            </div>

        </div>

        <!--Parte principal do site, onde tem cada comodo-->
        <!-- Container vazio inicialmente. É aqui (id="area_criacao") que o JavaScript vai injetar o HTML do novo card de criação -->
        <div class="conteudo_principal" id="area_criacao">

            <!-- Fechamento extra adicionado no código original - O ideal seria remover, mas mantive como pedido -->
            </div>
        </div>
        
    <!-- Importação do arquivo de script local contendo a lógica de criação do card -->
    <script src="app.js"></script>
    
    <!-- Fechamento extra adicionado no código original -->
    </div>
</body>
</html>
